contract_version: 1
milestone_owner: "Milestone 3"
purpose: "Local SQLite database integration and entity-linking configuration."
engine: "sqlite"
database:
  path: "data/processed/estate_intelligence.db"
  journal_mode: "WAL"
  foreign_keys: true
  busy_timeout_ms: 5000
  batch_size: 500
  overwrite_requires_rebuild: true
  transaction_mode: "immediate"
table_prefixes:
  source: "source"
  staging: "staging"
  curated: "curated"
  evidence: "evidence"
linkage:
  exact_identifier_score: 1.0
  composite_key_score: 0.95
  normalised_name_score: 0.90
  manual_review_threshold: 0.70
  matched_threshold: 0.85
paths:
  approved_input_dirs:
    - "data/sample"
    - "data/raw"
  approved_output_dirs:
    - "outputs/ingestion"
    - "data/processed"

