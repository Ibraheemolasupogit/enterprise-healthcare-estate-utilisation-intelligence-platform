name: Release Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install package and development dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build full canonical evidence
        run: make assurance-full
      - name: Verify release evidence
        run: make verify-release-evidence
      - name: Confirm clean generated state
        run: git diff --check
